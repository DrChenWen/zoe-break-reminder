<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a1628" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Zoe 休息提醒" />
  <meta name="description" content="Zoe 全屏视频休息提醒 - 屏幕前工作者的健康伴侣" />
  <title>Zoe 休息提醒</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230a1628'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='18' fill='%2360a5fa'>Z</text></svg>" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230a1628'/><text x='50%25' y='55%25' dominant-baseline='middle' text-anchor='middle' font-size='100' fill='%2360a5fa'>Z</text></svg>" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a1628;
      --bg2: #0f1f38;
      --card: #111827;
      --border: #1e3a5f;
      --blue: #60a5fa;
      --amber: #f59e0b;
      --green: #22c55e;
      --text: #e8f0ff;
      --gray: #64748b;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* ── 全屏视频层 ── */
    #videoOverlay {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 9999;
      align-items: center;
      justify-content: center;
    }
    #videoOverlay.active { display: flex; }
    #videoOverlay video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    #videoClose {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      font-size: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(8px);
    }

    /* ── 主界面 ── */
    .app {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    /* 头部 */
    .header {
      background: linear-gradient(135deg, #0f1f38, #0a1628);
      border-bottom: 1px solid var(--border);
      padding: 16px;
      text-align: center;
      flex-shrink: 0;
    }
    .avatar-wrap {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      border: 2px solid var(--blue);
      box-shadow: 0 0 16px rgba(96,165,250,0.4);
      overflow: hidden;
      margin: 0 auto 8px;
    }
    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .app-name {
      font-size: 18px;
      font-weight: 700;
      color: var(--blue);
      letter-spacing: 1px;
    }
    .app-sub {
      font-size: 12px;
      color: var(--gray);
      margin-top: 2px;
    }

    /* 内容区 */
    .content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 状态卡片 */
    .status-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      text-align: center;
    }
    .status-time {
      font-size: 48px;
      font-weight: 800;
      color: var(--blue);
      font-variant-numeric: tabular-nums;
      letter-spacing: 2px;
    }
    .status-label {
      font-size: 13px;
      color: var(--gray);
      margin-top: 4px;
    }
    .status-next {
      font-size: 12px;
      color: var(--gray);
      margin-top: 8px;
      opacity: 0.7;
    }

    /* 进度条 */
    .progress-bar {
      background: var(--bg2);
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      margin-top: 12px;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--blue), #93c5fd);
      border-radius: 8px;
      transition: width 1s linear;
    }

    /* 间隔设置 */
    .settings-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .settings-title {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }
    .interval-options {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .interval-btn {
      background: var(--bg2);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      padding: 10px 4px;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }
    .interval-btn.active {
      border-color: var(--blue);
      background: rgba(96,165,250,0.12);
      color: var(--blue);
    }
    .interval-btn span {
      display: block;
      font-size: 11px;
      color: var(--gray);
      margin-top: 2px;
    }

    /* 播放按钮 */
    .play-btn {
      background: linear-gradient(135deg, #1e40af, #1d4ed8);
      border: none;
      border-radius: 16px;
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 16px;
      width: 100%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(29,78,216,0.4);
      transition: all 0.2s;
    }
    .play-btn:active {
      transform: scale(0.97);
      box-shadow: 0 2px 8px rgba(29,78,216,0.3);
    }
    .play-btn.test-mode {
      background: linear-gradient(135deg, #1a3a2a, #166534);
      box-shadow: 0 4px 16px rgba(22,101,52,0.4);
    }

    /* 历史 */
    .history-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
    }
    .history-title {
      font-size: 13px;
      color: var(--gray);
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      font-size: 13px;
    }
    .history-item:last-child { border-bottom: none; }
    .history-time { color: var(--gray); }
    .history-count { color: var(--blue); font-weight: 600; }

    /* 底部提示 */
    .footer {
      padding: 12px 16px;
      text-align: center;
      font-size: 11px;
      color: var(--gray);
      opacity: 0.5;
      flex-shrink: 0;
    }

    /* 安装提示 */
    .install-banner {
      display: none;
      background: linear-gradient(135deg, #1e3a5f, #1e40af);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 0 16px;
      font-size: 13px;
      color: white;
      text-align: center;
      cursor: pointer;
    }
    .install-banner.show { display: block; }
    .install-banner strong { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

<!-- 全屏视频弹窗 -->
<div id="videoOverlay">
  <video id="reminderVideo" playsinline></video>
  <button id="videoClose" onclick="closeVideo()">✕</button>
</div>

<div class="app">

  <!-- 头部 -->
  <div class="header">
    <div class="avatar-wrap">
      <img src="zoe-avatar.jpg" alt="Zoe" />
    </div>
    <div class="app-name">Zoe 休息提醒</div>
    <div class="app-sub">屏幕前工作者的健康伴侣</div>
  </div>

  <!-- 安装提示 -->
  <div class="install-banner" id="installBanner" onclick="installApp()">
    <strong>📱 安装到手机桌面</strong>
    点击此处，添加到主屏幕
  </div>

  <div class="content">

    <!-- 倒计时状态 -->
    <div class="status-card">
      <div class="status-time" id="countdown">45:00</div>
      <div class="status-label">距下次休息提醒</div>
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill" style="width:0%"></div>
      </div>
      <div class="status-next" id="nextReminder">下次提醒：--:--</div>
    </div>

    <!-- 间隔设置 -->
    <div class="settings-card">
      <div class="settings-title">提醒间隔</div>
      <div class="interval-options">
        <button class="interval-btn" onclick="setInterval(25)" data-min="25">25<span>分钟</span></button>
        <button class="interval-btn active" onclick="setInterval(45)" data-min="45">45<span>分钟</span></button>
        <button class="interval-btn" onclick="setInterval(60)" data-min="60">60<span>分钟</span></button>
        <button class="interval-btn" onclick="setInterval(90)" data-min="90">90<span>分钟</span></button>
      </div>
    </div>

    <!-- 立即播放 -->
    <button class="play-btn test-mode" onclick="playNow()">
      ▶ 立即播放休息提醒视频
    </button>

    <!-- 历史 -->
    <div class="history-card">
      <div class="history-title">今日休息记录</div>
      <div id="historyList">
        <div class="history-item">
          <span class="history-time">暂无记录</span>
          <span class="history-count">—</span>
        </div>
      </div>
    </div>

  </div>

  <div class="footer">
    数据仅本地存储 · Zoe Break Reminder v1.0
  </div>
</div>

<script>
  // ── 配置 ──
  const VIDEO_URL = 'Zoe休息.mp4';
  const AVATAR_URL = 'zoe-avatar.jpg';
  const STORAGE_KEY = 'zoe_reminder_state';
  const MAX_HISTORY = 20;

  // ── 状态 ──
  let state = loadState();
  let timerSeconds = 0;
  let totalSeconds = 0;
  let timerInterval = null;

  // ── 状态读写 ──
  function loadState() {
    try {
      const s = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
      return {
        interval: s.interval || 45,
        history: Array.isArray(s.history) ? s.history : [],
        lastReset: s.lastReset || null,
      };
    } catch { return { interval: 45, history: [], lastReset: null }; }
  }

  function saveState() {
    // 每天自动重置历史
    const today = new Date().toDateString();
    if (state.lastReset !== today) {
      state.history = [];
      state.lastReset = today;
    }
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  // ── 间隔设置 ──
  function setInterval(min) {
    state.interval = min;
    saveState();
    document.querySelectorAll('.interval-btn').forEach(b => {
      b.classList.toggle('active', parseInt(b.dataset.min) === min);
    });
    resetTimer();
  }

  // ── 倒计时 ──
  function resetTimer() {
    totalSeconds = state.interval * 60;
    timerSeconds = totalSeconds;
    updateDisplay();
  }

  function updateDisplay() {
    const m = Math.floor(timerSeconds / 60);
    const s = timerSeconds % 60;
    document.getElementById('countdown').textContent =
      `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;

    const pct = totalSeconds > 0 ? ((totalSeconds - timerSeconds) / totalSeconds) * 100 : 0;
    document.getElementById('progressFill').style.width = pct + '%';

    const next = new Date(Date.now() + timerSeconds * 1000);
    document.getElementById('nextReminder').textContent =
      '下次提醒：' + next.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
  }

  function tick() {
    if (timerSeconds > 0) {
      timerSeconds--;
      updateDisplay();
    } else {
      // 时间到！
      clearInterval(timerInterval);
      playNow();
      // 重置并继续
      timerSeconds = totalSeconds;
      timerInterval = setInterval(tick, 1000);
    }
  }

  function startTimer() {
    if (timerInterval) clearInterval(timerInterval);
    timerSeconds = state.interval * 60;
    totalSeconds = state.interval * 60;
    updateDisplay();
    timerInterval = setInterval(tick, 1000);
  }

  // ── 视频播放 ──
  function playNow() {
    const overlay = document.getElementById('videoOverlay');
    const video = document.getElementById('reminderVideo');

    overlay.classList.add('active');

    // 记录历史
    const now = new Date();
    state.history.unshift({
      time: now.toISOString(),
      label: now.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }),
    });
    if (state.history.length > MAX_HISTORY) state.history.pop();
    saveState();
    renderHistory();

    // 播放视频
    video.src = VIDEO_URL;
    video.load();

    video.oncanplay = () => {
      video.play().catch(e => {
        console.warn('Autoplay blocked:', e);
        showVideoFallback();
      });
      // 播放时也发一条通知（双重提醒）
      showNotif('\U0001f499 Zoe \u4f11\u606f\u63d0\u9192', '\u653e\u677e\u8eab\u5fc3 \xb7 \u5f00\u53d1\u601d\u7ef4 \xb7 \u66f4\u597d\u7684\u4f60', NOTIF_ICON);
    };

    video.onerror = () => {
      console.warn('Video load error, showing fallback');
      showVideoFallback();
    };
  }

  // 视频加载失败时显示文字弹窗
  function showVideoFallback() {
    const overlay = document.getElementById('videoOverlay');
    const video = document.getElementById('reminderVideo');
    video.style.display = 'none';

    let msg = overlay.querySelector('.fallback-msg');
    if (!msg) {
      msg = document.createElement('div');
      msg.className = 'fallback-msg';
      msg.style.cssText = 'position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a1628;color:white;font-family:Microsoft YaHei,sans-serif;text-align:center;padding:32px';
      msg.innerHTML = '<div style="font-size:48px;margin-bottom:16px">&#10084;&#65039; Zoe</div><div style="font-size:28px;font-weight:700;margin-bottom:12px">休息一下，<br>来学国际象棋吧！</div><div style="font-size:16px;color:#94a3b8;margin-bottom:24px">放松身心 · 开发思维 · 更好的你</div><div style="font-size:13px;color:#475569">点击任意位置关闭</div>';
      overlay.insertBefore(msg, video.nextSibling);
    }
    msg.style.display = 'flex';
    overlay.onclick = () => closeVideo();
  }

  function closeVideo() {
    const overlay = document.getElementById('videoOverlay');
    const video = document.getElementById('reminderVideo');
    video.pause();
    video.style.display = '';
    const msg = overlay.querySelector('.fallback-msg');
    if (msg) msg.style.display = 'none';
    overlay.classList.remove('active');
    overlay.onclick = null;
  }

  // 视频播放完毕自动关闭
  document.getElementById('reminderVideo').addEventListener('ended', closeVideo);

  // ── 历史记录 ──
  function renderHistory() {
    const el = document.getElementById('historyList');
    if (state.history.length === 0) {
      el.innerHTML = '<div class="history-item"><span class="history-time">暂无记录</span><span class="history-count">—</span></div>';
      return;
    }
    el.innerHTML = state.history.slice(0, 10).map(h => `
      <div class="history-item">
        <span class="history-time">${h.label}</span>
        <span class="history-count">已休息</span>
      </div>
    `).join('');
  }

  // ── PWA 安装 ──
  let deferredPrompt = null;
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault();
    deferredPrompt = e;
    document.getElementById('installBanner').classList.add('show');
  });

  function installApp() {
    if (deferredPrompt) {
      deferredPrompt.prompt();
      deferredPrompt.userChoice.then(r => {
        if (r.outcome === 'accepted') {
          document.getElementById('installBanner').classList.remove('show');
        }
        deferredPrompt = null;
      });
    } else {
      alert('在浏览器菜单中选择"添加到主屏幕"或"安装应用"');
    }
  }

  // ── 浏览器通知 ──
  let notifPermission = Notification.permission;

  async function requestNotifPermission() {
    if (!('Notification' in window)) {
      return 'unsupported';
    }
    if (notifPermission === 'granted') {
      return 'granted';
    }
    const result = await Notification.requestPermission();
    notifPermission = result;
    return result;
  }

  function showNotif(title, body, icon) {
    if (!('Notification' in window)) return;
    if (Notification.permission !== 'granted') return;
    try {
      const n = new Notification(title, {
        body,
        icon: icon || 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="%230a1628"/><text x="50%25" y="55%25" dominant-baseline="middle" text-anchor="middle" font-size="36" fill="%2360a5fa">Z</text></svg>',
        tag: 'zoe-reminder',
        renotify: true,
        requireInteraction: false,
        silent: false,
      });
      n.onclick = () => { window.focus(); n.close(); };
      setTimeout(() => n.close(), 15000);
    } catch(e) { console.warn('Notification failed:', e); }
  }

  // ── 打开 App 时检查是否该提醒了 ──
  function checkOnResume() {
    const now = Date.now();
    const last = state.lastNotifTime || 0;
    const interval = state.interval * 60 * 1000;

    if (last === 0 || (now - last) >= interval) {
      // 该提醒了
      state.lastNotifTime = now;
      saveState();
      showNotif('💙 Zoe', '休息一下，来学国际象棋吧！', '');
      playNow();
    }
  }

  // 每次 App 可见时检查
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') {
      checkOnResume();
    }
  });

  // 首次访问引导开启通知
  function setupNotifications() {
    if (notifPermission === 'default') {
      const banner = document.createElement('div');
      banner.id = 'notifBanner';
      banner.style.cssText = 'position:fixed;bottom:0;left:0;right:0;background:linear-gradient(135deg,#1e3a5f,#1e40af);padding:14px 16px;display:flex;align-items:center;gap:10px;z-index:9999;font-size:14px;color:white;font-family:Microsoft YaHei,sans-serif;box-shadow:0-4px 16px rgba(0,0,0,0.3)';
      banner.innerHTML = '<span style="flex:1">开启通知，Zoe 会在休息时间提醒你</span><button onclick="dismissNotifBanner(this.parentElement)" style="background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:8px;color:white;padding:6px 14px;cursor:pointer;font-size:13px">忽略</button><button id="allowNotifBtn" style="background:white;color:#1e40af;border:none;border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:13px">开启</button>';
      document.body.appendChild(banner);
      document.getElementById('allowNotifBtn').onclick = async () => {
        const r = await requestNotifPermission();
        banner.remove();
        if (r === 'granted') {
          showNotif('💙 Zoe 已开启', '你会在休息时间收到提醒！');
        }
      };
    }
  }

  function dismissNotifBanner(el) { el.remove(); }

  // 通知图标
  const NOTIF_ICON = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0a1628"/><text x="50%" y="55%" dominant-baseline="middle" text-anchor="middle" font-size="36" fill="#60a5fa">Z</text></svg>');

  // ── Service Worker ──
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js')
      .then(reg => console.log('SW registered'))
      .catch(err => console.error('SW failed:', err));
  }

  // ── 启动 ──
  // 恢复间隔按钮状态
  document.querySelectorAll('.interval-btn').forEach(b => {
    b.classList.toggle('active', parseInt(b.dataset.min) === state.interval);
  });

  renderHistory();
  startTimer();
  setupNotifications();
  // 启动时也检查一次（如果上次提醒已过期）
  checkOnResume();
</script>
</body>
</html>
